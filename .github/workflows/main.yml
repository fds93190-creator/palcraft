name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: palcraft-v1-source-UNTESTED/palcraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          build-root-directory: palcraft-v1-source-UNTESTED/palcraft
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: palcraft-jar
          path: palcraft-v1-source-UNTESTED/palcraft/build/libs/*.jar
